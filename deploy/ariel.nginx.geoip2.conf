# Country lookup for the Ariel storefront (language and currency, server/geo.mjs).
# Install as /etc/nginx/conf.d/ariel-geoip2.conf (http context) — see deploy/README.md, "Visitor country".
# Requires: sudo apt install libnginx-mod-http-geoip2, and a country database at the path below.
geoip2 /var/lib/GeoIP/country.mmdb {
    auto_reload 24h;
    $geoip2_country_code default=XX country iso_code;
}
