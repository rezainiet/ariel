server {
    listen 80;
    server_name destockage-suisse.store www.destockage-suisse.store;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://destockage-suisse.store$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.destockage-suisse.store;
    ssl_certificate /etc/letsencrypt/live/destockage-suisse.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/destockage-suisse.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://destockage-suisse.store$request_uri;
}

server {
    listen 443 ssl;
    server_name destockage-suisse.store;
    ssl_certificate /etc/letsencrypt/live/destockage-suisse.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/destockage-suisse.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Visitor country for language/currency (server/geo.mjs). Always overwritten here, so a client
        # can never supply it. After installing GeoIP2 (deploy/ariel.nginx.geoip2.conf), replace "" with
        # $geoip2_country_code and set GEO_COUNTRY_HEADER=x-geo-country in /etc/ariel/ariel.env.
        proxy_set_header X-Geo-Country "";
        proxy_set_header Connection "";
    }
}
