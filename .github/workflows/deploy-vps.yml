name: Deploy Ariel to VPS

on:
  workflow_dispatch:
    inputs:
      launch_mode:
        description: Preview, incomplete build with visible missing details, or configured production build
        type: choice
        required: true
        default: preview
        options:
          - preview
          - incomplete
          - configured

permissions:
  contents: read

concurrency:
  group: ariel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ vars.VPS_HOST }}
      DEPLOY_USER: ${{ vars.VPS_USER }}
      BUILD_ENV: ${{ secrets.VITE_ENV_FILE }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      LAUNCH_MODE: ${{ inputs.launch_mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[0-9.]+$ && "$DEPLOY_USER" =~ ^[a-z][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          if [[ "$LAUNCH_MODE" == configured ]]; then
            test -n "$BUILD_ENV"
            printf '%s\n' "$BUILD_ENV" > .env.production.local
            node scripts/check-deploy-env.mjs .env.production.local
          elif [[ "$LAUNCH_MODE" != preview && "$LAUNCH_MODE" != incomplete ]]; then
            echo 'Invalid launch mode' >&2
            exit 1
          fi
      - name: Build and test
        run: |
          npm ci
          node --test server/*.test.mjs
          npm run build
      - name: Package release
        run: tar -czf "/tmp/ariel-${GITHUB_SHA}.tar.gz" dist server src package.json package-lock.json
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/ariel_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ariel_deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy and verify service
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/ariel_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${ssh_opts[@]}" "/tmp/ariel-${GITHUB_SHA}.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/opt/ariel/incoming/${GITHUB_SHA}.tar.gz"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA' '$LAUNCH_MODE'" < deploy/deploy-vps.sh
      - name: Verify public storefront and analytics access
        shell: bash
        run: |
          set -euo pipefail
          origin=https://destockage-suisse.store
          curl --fail --silent --show-error --retry 3 --connect-timeout 5 --max-time 15 "$origin/" -o /tmp/ariel-home.html
          grep -q '<div id="root"></div>' /tmp/ariel-home.html
          curl --fail --silent --show-error --retry 3 --connect-timeout 5 --max-time 15 "$origin/api/stock" -o /tmp/ariel-stock.json
          node -e "const s=require('/tmp/ariel-stock.json'); if(!s || typeof s !== 'object') process.exit(1)"
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$origin/api/admin/analytics?hours=24")
          test "$status" = 401
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$origin/api/analytics")
          test "$status" = 422
          echo 'Public storefront, stock API, analytics authentication, and payload validation passed'
